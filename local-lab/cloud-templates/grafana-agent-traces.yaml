# Loaded only through compose.grafana.yaml and grafana.sh.
extensions:
  basicauth/grafana_cloud:
    client_auth:
      username: ${env:GRAFANA_OTLP_INSTANCE_ID}
      password: ${env:GRAFANA_CLOUD_TOKEN}
processors:
  filter/grafana_agent_only:
    error_mode: propagate
    traces:
      span:
        - 'resource.attributes["service.name"] != "agent"'
  resource/grafana_agent:
    attributes:
      - key: service.name
        value: astronomy-shop-lab
        action: upsert
      - key: agento11y.record
        value: true
        action: upsert
  transform/grafana_agent:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - set(span.attributes["agento11y.record"], true)
          - set(span.attributes["gen_ai.agent.name"], "astronomy-shop-lab")
  batch/grafana_agent:
    timeout: 2s
    send_batch_size: 128
    send_batch_max_size: 128
exporters:
  otlp_http/grafana_agent:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana_cloud
    compression: gzip
    timeout: 15s
    sending_queue:
      queue_size: 20
service:
  telemetry:
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [opamp, basicauth/grafana_cloud]
  pipelines:
    traces/grafana_agent:
      receivers: [otlp]
      processors: [filter/grafana_agent_only, resource_detection, memory_limiter, transform/sanitize_spans, gen_ai_normalizer, transform/redact_sensitive_data, redaction, resource/grafana_agent, transform/grafana_agent, batch/grafana_agent]
      exporters: [otlp_http/grafana_agent]
